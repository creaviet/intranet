services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do not publish MongoDB to the host in production.
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: mongodb://mongo:27017/intranet
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
